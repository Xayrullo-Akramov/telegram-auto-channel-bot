services:
  - type: worker
    name: telegram-auto-channel-bot
    env: python
    buildCommand: ""
    startCommand: "bash start.sh"
    plan: free
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
